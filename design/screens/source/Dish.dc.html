<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tajine kefta et œufs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#17142B}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:0;padding:0;color:inherit;background:none;text-align:left}
textarea{font-family:inherit}
</style>
</helmet>
<div style="width:390px;height:1780px;box-sizing:border-box;background:#FFFFFF;display:flex;flex-direction:column;overflow:hidden">

  <div style="position:relative;height:300px;flex:none;background:#FBE7DF;overflow:hidden;display:flex;justify-content:center">
    <img src="../../assets/food/tajine.svg" alt="Tajine kefta et œufs" style="width:330px;height:330px;margin-top:6px">
    <a href="Kitchen.dc.html" aria-label="Fermer" style="position:absolute;top:52px;left:16px;width:40px;height:40px;border-radius:20px;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <button onClick="{{ toggleFav }}" aria-pressed="{{ favPressed }}" aria-label="Favori" style="position:absolute;top:52px;right:16px;width:40px;height:40px;border-radius:20px;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="{{ favFill }}" stroke="#C04A22" stroke-width="2.2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
  </div>

  <div style="padding:20px 16px 0;display:flex;flex-direction:column;gap:10px">
    <h1 style="margin:0;font-weight:800;font-size:25px;line-height:1.15;letter-spacing:-.04em">Tajine kefta &amp; œufs</h1>
    <p style="margin:0;font-size:14.5px;line-height:1.5;color:#6B6880">Boulettes de kefta au cumin et paprika, sauce tomate mijotée, œufs coulants et persil. Servi dans son tajine.</p>
    <div style="display:flex;align-items:center;gap:8px"><b style="font-size:21px">55 DH</b><s style="font-size:15px;color:#8B8799">65 DH</s><span style="min-height:24px;padding:0 8px;border-radius:8px;background:#C04A22;color:#FFFFFF;font-size:12px;font-weight:800;display:flex;align-items:center">−15 %</span></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <span style="min-height:30px;padding:0 10px;border-radius:15px;background:#E3F4EC;color:#0B6B49;font-size:13px;font-weight:700;display:flex;align-items:center">{{ kcal }}&nbsp;kcal</span>
      <span style="min-height:30px;padding:0 10px;border-radius:15px;background:#E8EAFD;color:#1C2290;font-size:13px;font-weight:700;display:flex;align-items:center">{{ prot }}&nbsp;g protéines</span>
      <span style="min-height:30px;padding:0 10px;border-radius:15px;background:#F4F3F7;font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="#F6B52E"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>4,8 (1,2k)</span>
    </div>
  </div>

  <div style="padding:8px 16px 0;display:flex;flex-direction:column">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
      <section style="padding-top:20px;display:flex;flex-direction:column">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:6px">
          <div style="display:flex;flex-direction:column;gap:1px"><h2 style="margin:0;font-weight:800;font-size:17px;letter-spacing:-.02em">{{ g.title }}</h2><span style="font-size:13px;color:#6B6880">{{ g.sub }}</span></div>
          <span style="{{ g.badgeStyle }}">{{ g.badge }}</span>
        </div>
        <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="3">
          <button onClick="{{ r.pick }}" aria-pressed="{{ r.pressed }}" style="width:100%;min-height:54px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ECEAF1">
            <span style="flex:1;font-size:15px;font-weight:500">{{ r.label }}</span>
            <span style="font-size:14px;color:#6B6880">{{ r.price }}</span>
            <span style="{{ r.ctrl }}">
              <sc-if value="{{ r.showDot }}" hint-placeholder-val="{{ false }}"><span style="width:10px;height:10px;border-radius:5px;background:#FFFFFF"></span></sc-if>
              <sc-if value="{{ r.showCheck }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if>
            </span>
          </button>
        </sc-for>
      </section>
    </sc-for>

    <label style="padding-top:22px;display:flex;flex-direction:column;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.02em">Instructions pour la cuisine
      <textarea rows="3" placeholder="Ex. : sauce à part, bien cuit…" style="border-radius:14px;border:1.5px solid #ECEAF1;background:#F4F3F7;padding:12px 14px;font-size:15px;font-weight:400;color:#17142B;resize:none;box-sizing:border-box;letter-spacing:0"></textarea>
    </label>
  </div>

  <div style="margin-top:auto;box-sizing:border-box;padding:14px 16px 32px;background:#FFFFFF;border-top:1px solid #ECEAF1;display:flex;align-items:center;gap:12px">
    <div style="display:flex;align-items:center;gap:4px;border-radius:27px;background:#F4F3F7;padding:4px">
      <button onClick="{{ minus }}" aria-label="Moins" style="width:46px;height:46px;border-radius:23px;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <b style="min-width:26px;text-align:center;font-size:16px">{{ qty }}</b>
      <button onClick="{{ plus }}" aria-label="Plus" style="width:46px;height:46px;border-radius:23px;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <a href="Cart.dc.html" style="flex:1;min-height:54px;border-radius:27px;background:#2B33C6;color:#FFFFFF;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center">Ajouter ·&nbsp;{{ total }}&nbsp;DH</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1780}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { size: 'solo', spice: 'moyen', sides: { khobz: true }, sans: {}, qty: 1, fav: false };
  }
  renderVals() {
    const st = this.state;
    const radio = (sel) => 'width:24px;height:24px;flex:none;border-radius:12px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;' + (sel ? 'background:#2B33C6' : 'border:2px solid #CFCCD9');
    const check = (sel) => 'width:24px;height:24px;flex:none;border-radius:7px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;' + (sel ? 'background:#2B33C6' : 'border:2px solid #CFCCD9');
    const badge = (req) => 'flex:none;min-height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:700;display:flex;align-items:center;' + (req ? 'background:#17142B;color:#FFFFFF' : 'background:#F4F3F7;color:#3D3A4F');
    const SIZES = [{ id: 'solo', label: 'Solo · 1 pers.', add: 0 }, { id: 'duo', label: 'Duo · 2 pers.', add: 38 }, { id: 'lmida', label: 'Lmida · 4 pers.', add: 110 }];
    const SPICES = [{ id: 'doux', label: 'Doux' }, { id: 'moyen', label: 'Moyen' }, { id: 'har', label: 'Har' }, { id: 'harbzzaf', label: 'Har bzzaf' }];
    const SIDES = [{ id: 'khobz', label: 'Khobz dar', add: 0, k: 240 }, { id: 'frites', label: 'Frites maison', add: 10, k: 320 }, { id: 'salade', label: 'Salade marocaine', add: 12, k: 60 }, { id: 'atay', label: 'Atay na3na3', add: 12, k: 80 }];
    const SANS = [{ id: 'oignons', label: 'Sans oignons' }, { id: 'persil', label: 'Sans persil' }, { id: 'oeufs', label: 'Sans œufs' }];
    const nSides = SIDES.filter((s) => st.sides[s.id]).length;
    const size = SIZES.find((s) => s.id === st.size);
    let unit = 55 + size.add, kcal = 640, prot = 38;
    SIDES.forEach((s) => { if (st.sides[s.id]) { unit += s.add; kcal += s.k; } });
    if (st.sides.khobz) prot += 8;
    if (st.sans.oeufs) { kcal -= 140; prot -= 12; }
    const groups = [
      { title: 'Taille', sub: 'Choisis 1', badge: 'Obligatoire', badgeStyle: badge(true),
        rows: SIZES.map((s) => ({ label: s.label, price: s.add ? '+' + s.add + ' DH' : '', pressed: st.size === s.id ? 'true' : 'false', showDot: st.size === s.id, showCheck: false, ctrl: radio(st.size === s.id), pick: () => this.setState({ size: s.id }) })) },
      { title: 'Piquant', sub: 'Choisis 1', badge: 'Obligatoire', badgeStyle: badge(true),
        rows: SPICES.map((s) => ({ label: s.label, price: '', pressed: st.spice === s.id ? 'true' : 'false', showDot: st.spice === s.id, showCheck: false, ctrl: radio(st.spice === s.id), pick: () => this.setState({ spice: s.id }) })) },
      { title: 'Accompagnements', sub: 'Jusqu’à 2', badge: 'Optionnel', badgeStyle: badge(false),
        rows: SIDES.map((s) => { const on = !!st.sides[s.id]; return { label: s.label, price: s.add ? '+' + s.add + ' DH' : 'inclus', pressed: on ? 'true' : 'false', showDot: false, showCheck: on, ctrl: check(on), pick: () => { if (!on && nSides >= 2) return; this.setState({ sides: { ...st.sides, [s.id]: !on } }); } }; }) },
      { title: 'Retirer', sub: 'Ce que tu ne veux pas', badge: 'Optionnel', badgeStyle: badge(false),
        rows: SANS.map((s) => { const on = !!st.sans[s.id]; return { label: s.label, price: '', pressed: on ? 'true' : 'false', showDot: false, showCheck: on, ctrl: check(on), pick: () => this.setState({ sans: { ...st.sans, [s.id]: !on } }) }; }) }
    ];
    return {
      groups, kcal, prot, qty: st.qty, total: unit * st.qty,
      favFill: st.fav ? '#C04A22' : 'none', favPressed: st.fav ? 'true' : 'false',
      toggleFav: () => this.setState({ fav: !st.fav }),
      minus: () => this.setState({ qty: Math.max(1, st.qty - 1) }),
      plus: () => this.setState({ qty: Math.min(9, st.qty + 1) })
    };
  }
}
</script>
</body>
</html>
